<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skip the test</title>
<style>
:root{
  --bg: #d8d2c0;
  --fg: #1b1b1b;
  --btn: #f4f0e1;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1c;
    --fg: #e8e4d8;
    --btn: #2b2b2b;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1c1c1c;
  --fg: #e8e4d8;
  --btn: #2b2b2b;
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height: 100%;
}

body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  width: min(calc(100vw - 20px), 960px, calc((100vh - 130px) * 1.6667));
  image-rendering: pixelated;
  border: 3px solid var(--fg);
  background: #f4f0e1;
}

p {
  margin: 10px 12px 0;
  font-size: 13px;
  text-align: center;
}

/* Touch controls for mobile devices */
#pad {
  display: none;
  gap: 10px;
  margin-top: 10px;
  width: calc(100vw - 20px);
}

@media (pointer: coarse) {
  #pad { display: flex; }
}

#pad button {
  font: bold 18px 'Courier New', monospace;
  padding: 16px 22px;
  border: 3px solid var(--fg);
  background: var(--btn);
  color: var(--fg);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

#pad button:nth-child(3) {
  flex: 1;
}
</style>
</head>
<body>

<canvas id="c" width="320" height="192"></canvas>
<p>arrows or WASD to move, space to jump, R to restart the level</p>

<div id="pad">
  <button data-k="l">&lt;</button>
  <button data-k="r">&gt;</button>
  <button data-k="j">JUMP</button>
</div>

<script>
const T = 16; // Tile size
const W = 20; // Level width in tiles
const H = 12; // Level height in tiles

const cv = document.getElementById('c');
const g = cv.getContext('2d');

const LV = [
  {
    n: 'English',
    m: [
      '', '', '', '', '',
      '...............c.E',
      '.............######',
      '..........c',
      '......c.###',
      '...###',
      '.P',
      '####################'
    ]
  },
  {
    n: 'Maths',
    m: [
      '', '', '', '',
      '.................E',
      '..............######',
      '..........c',
      '.........###',
      '.....c',
      '....###',
      '.P.....^^^^^^^^^^',
      '####################'
    ]
  },
  {
    n: 'History',
    m: [
      '', '', '', '',
      '................E',
      '..............#####',
      '...........c',
      '..........###',
      '......c',
      '.....###',
      '.P.......e......e',
      '####################'
    ]
  },
  {
    n: 'Oral exam',
    m: [
      '', '',
      '.E',
      '###....c',
      '.....e',
      '...#####...c',
      '...........e',
      '.........#####..c',
      '',
      '...............###',
      '...^^^^^^^^^^^^^...P',
      '####################'
    ]
  }
];

let cur = 0;
let grid, coins, ens, pl, ex;
let state = 'title';
let tk = 0;
let frames = 0;
let deaths = 0;
let got = 0;
let lvlGot = 0;
let total = 0;
let deadT = 0;
let lock = 0;
let best = null;
let newRec = false;

const K = { l: false, r: false, j: false };

// Count total highlighters across levels
LV.forEach(l => l.m.forEach(r => {
  for (const ch of r) {
    if (ch === 'c') total++;
  }
}));

try {
  best = localStorage.getItem('sv_best');
  if (best !== null) best = +best;
} catch (e) {
  console.log("Couldn't read from localStorage, probably in private mode.");
}

function load(i) {
  grid = [];
  coins = [];
  ens = [];
  ex = null;
  
  for (let y = 0; y < H; y++) {
    const r = (LV[i].m[y] || '').padEnd(W, '.');
    const line = [];
    
    for (let x = 0; x < W; x++) {
      let t = r[x];
      
      if (t === 'P') {
        pl = { x: x * T + 3, y: y * T + 2, vx: 0, vy: 0, w: 10, h: 14, face: 1, og: false, coy: 0, jb: 0 };
        t = '.';
      } else if (t === 'c') {
        coins.push({ x: x * T + 4, y: y * T + 4, got: false });
        t = '.';
      } else if (t === 'e') {
        ens.push({ x: x * T + 2, y: y * T + 4, w: 12, h: 12, d: -1, alive: true });
        t = '.';
      } else if (t === 'E') {
        ex = { x: x * T + 2, y: y * T, w: 12, h: 16 };
        t = '.';
      }
      
      line.push(t);
    }
    grid.push(line);
  }
}

function start() {
  cur = 0;
  deaths = 0;
  got = 0;
  lvlGot = 0;
  frames = 0;
  newRec = false;
  load(0);
  state = 'play';
  window.focus();
}

function resetLevel() {
  got -= lvlGot;
  lvlGot = 0;
  load(cur);
}

function anyKey() {
  if (state === 'title' || (state === 'end' && lock <= 0)) {
    start();
    return true;
  }
  return false;
}

let ac;
function snd(f, d, type, v, f2) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const n = ac.createGain();
    const t = ac.currentTime;
    
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    
    if (f2) o.frequency.linearRampToValueAtTime(f2, t + d);
    
    n.gain.setValueAtTime(v || 0.04, t);
    n.gain.linearRampToValueAtTime(0, t + d);
    
    o.connect(n);
    n.connect(ac.destination);
    
    o.start();
    o.stop(t + d);
  } catch (e) {
  }
}

const sol = (tx, ty) => tx < 0 || tx >= W ? true : (ty < 0 || ty >= H ? false : grid[ty][tx] === '#');

function hit(x, y, w, h) {
  for (let ty = Math.floor(y / T); ty <= Math.floor((y + h - 0.01) / T); ty++) {
    for (let tx = Math.floor(x / T); tx <= Math.floor((x + w - 0.01) / T); tx++) {
      if (sol(tx, ty)) return true;
    }
  }
  return false;
}

const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function die() {
  if (state !== 'play') return;
  state = 'dead';
  deadT = 40;
  deaths++;
  snd(300, 0.45, 'sawtooth', 0.05, 50);
}

function nextLevel() {
  snd(520, 0.1);
  setTimeout(() => snd(660, 0.1), 90);
  setTimeout(() => snd(880, 0.2), 180);
  
  cur++;
  lvlGot = 0;
  
  if (cur >= LV.length) {
    state = 'end';
    lock = 40;
    if (best === null || deaths < best) {
      best = deaths;
      newRec = true;
      try {
        localStorage.setItem('sv_best', deaths);
      } catch (e) {}
    }
  } else {
    load(cur);
  }
}

function update() {
  tk++;
  if (lock > 0) lock--;
  
  if (state === 'dead') {
    if (--deadT <= 0) {
      resetLevel();
      state = 'play';
    }
    return;
  }
  
  if (state !== 'play') return;
  
  frames++;
  const p = pl;
  const dir = (K.r ? 1 : 0) - (K.l ? 1 : 0);
  
  if (dir) p.face = dir;
  p.vx += (dir * 1.7 - p.vx) * 0.35;
  
  if (p.jb > 0) p.jb--;
  if (p.og) p.coy = 6;
  else if (p.coy > 0) p.coy--;
  
  if (p.jb > 0 && p.coy > 0) {
    p.vy = -6.2;
    p.jb = 0;
    p.coy = 0;
    snd(300, 0.14, 'square', 0.04, 620);
  }
  
  if (!K.j && p.vy < -2.5) p.vy = -2.5;
  p.vy = Math.min(p.vy + 0.35, 7);

  p.x += p.vx;
  if (hit(p.x, p.y, p.w, p.h)) {
    p.x = p.vx > 0 ? Math.floor((p.x + p.w - 0.01) / T) * T - p.w : (Math.floor(p.x / T) + 1) * T;
    p.vx = 0;
  }
  
  p.y += p.vy;
  p.og = false;
  if (hit(p.x, p.y, p.w, p.h)) {
    if (p.vy > 0) {
      p.y = Math.floor((p.y + p.h - 0.01) / T) * T - p.h;
      p.og = true;
    } else {
      p.y = (Math.floor(p.y / T) + 1) * T;
    }
    p.vy = 0;
  }

  for (let ty = Math.floor(p.y / T); ty <= Math.floor((p.y + p.h - 0.01) / T); ty++) {
    for (let tx = Math.floor(p.x / T); tx <= Math.floor((p.x + p.w - 0.01) / T); tx++) {
      if (grid[ty] && grid[ty][tx] === '^' && ov(p, { x: tx * T + 2, y: ty * T + 8, w: 12, h: 8 })) {
        die();
      }
    }
  }
  
  if (p.y > H * T + 10) die();

  for (const c of coins) {
    if (!c.got && ov(p, { x: c.x, y: c.y, w: 8, h: 8 })) {
      c.got = true;
      got++;
      lvlGot++;
      snd(900, 0.07);
      setTimeout(() => snd(1300, 0.1), 60);
    }
  }
  
  for (const e of ens) {
    if (!e.alive) continue;
    
    e.x += e.d * 0.5;
    const fx = e.d > 0 ? e.x + e.w : e.x;
    
    if (hit(e.x, e.y, e.w, e.h) || !sol(Math.floor((fx + e.d * 0.5) / T), Math.floor((e.y + e.h + 1) / T))) {
      e.x -= e.d * 0.5;
      e.d *= -1;
    }
    
    if (ov(p, e)) {
      if (p.vy > 0 && p.y + p.h - e.y < 9) {
        e.alive = false;
        p.vy = -4.8;
        snd(220, 0.12, 'square', 0.05, 70);
      } else {
        die();
      }
    }
  }
  
  if (state === 'play' && ov(p, ex)) nextLevel();
}

const INK = '#1b1b1b';
const RED = '#c4252a';
const BLUE = '#2b4fa0';
const HL = '#f5d90a';

function paper() {
  g.fillStyle = '#f4f0e1';
  g.fillRect(0, 0, 320, 192);
  
  g.fillStyle = '#bfd0e3';
  for (let x = 0; x < 320; x += 8) g.fillRect(x, 0, 1, 192);
  for (let y = 0; y < 192; y += 8) g.fillRect(0, y, 320, 1);
  
  g.fillStyle = '#e6a3a3';
  g.fillRect(24, 0, 1, 192);
}

function drawPlayer() {
  const p = pl;
  const x = Math.round(p.x);
  const y = Math.round(p.y);
  const f = p.face;
  
  if (state === 'dead' && (deadT >> 2) % 2) return;
  
  g.fillStyle = '#d9731a';
  g.fillRect(f > 0 ? x - 2 : x + 9, y + 6, 3, 6);          
  
  const w = p.og && Math.abs(p.vx) > 0.4;
  const s = w && ((tk >> 2) & 1);
  const a = w ? (s ? 3 : 2) : 3;
  const b = w ? (s ? 2 : 3) : 3;
  
  g.fillStyle = INK;
  g.fillRect(x + 1, y + 14 - a, 3, a);
  g.fillRect(x + 6, y + 14 - b, 3, b); 
  
  // Bodyandhead
  g.fillStyle = BLUE;
  g.fillRect(x, y + 5, 10, 7);                        
  g.fillStyle = '#f1c69b';
  g.fillRect(x + 1, y, 8, 6);                    
  
  g.fillStyle = INK;
  g.fillRect(x + 1, y, 8, 2);
  g.fillRect(x + (f > 0 ? 6 : 3), y + 3, 1, 2);
}

function drawGame() {
  paper();
  
  for (let ty = 0; ty < H; ty++) {
    for (let tx = 0; tx < W; tx++) {
      const t = grid[ty][tx];
      const x = tx * T;
      const y = ty * T;
      
      if (t === '#') {
        g.fillStyle = INK;
        g.fillRect(x, y, T, T);
        g.fillStyle = '#4a4a4a';
        g.fillRect(x + 3, y + 3, 2, 2);
        g.fillRect(x + 10, y + 9, 2, 2);
      } else if (t === '^') {
        g.fillStyle = RED;
        for (let k = 0; k < 2; k++) {
          g.beginPath();
          g.moveTo(x + k * 8, y + T);
          g.lineTo(x + k * 8 + 4, y + 8);
          g.lineTo(x + k * 8 + 8, y + T);
          g.fill();
        }
      }
    }
  }
  
  g.fillStyle = INK;
  g.fillRect(ex.x, ex.y, 12, 16);
  g.fillStyle = '#2e9e4f';
  g.fillRect(ex.x + 1, ex.y + 1, 10, 15);
  g.fillStyle = HL;
  g.fillRect(ex.x + 8, ex.y + 8, 2, 2);
  
  for (const c of coins) {
    if (c.got) continue;
    const bob = Math.round(Math.sin(tk / 12 + c.x) * 1.5);
    g.fillStyle = HL;
    g.beginPath();
    g.arc(c.x + 4, c.y + 4 + bob, 4, 0, 7);
    g.fill();
  }
  
  g.font = 'bold 15px monospace';
  g.textAlign = 'left';
  g.fillStyle = RED;
  for (const e of ens) {
    if (e.alive) g.fillText('4', e.x + 1, e.y + 12);
  }
  
  drawPlayer();
  
  g.font = 'bold 8px monospace';
  g.fillStyle = INK;
  g.textAlign = 'left';
  g.fillText((cur + 1) + '/' + LV.length + ' ' + LV[cur].n, 4, 9);
  g.fillText('fails ' + deaths, 4, 188);
  
  g.textAlign = 'right';
  g.fillText('highlighters ' + got + '/' + total, 316, 9);
  
  if (state === 'dead') {
    g.textAlign = 'center';
    g.font = 'bold 20px monospace';
    g.fillStyle = RED;
    g.fillText('FAILED!', 160, 100);
  }
}

const fmt = f => {
  const s = Math.floor(f / 60);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

function drawTitle() {
  paper();
  g.textAlign = 'center';
  g.fillStyle = INK;
  g.font = 'bold 26px monospace';
  g.fillText('SKIP THE', 160, 62);
  g.fillText('TEST', 160, 90);
  
  g.fillStyle = RED;
  g.fillRect(124, 97, 72, 3);
  
  g.fillStyle = INK;
  g.font = 'bold 9px monospace';
  if ((tk >> 5) % 2 === 0) {
    g.fillText('click or press any key', 160, 128);
  }
  
  g.font = '8px monospace';
  g.fillText('4 subjects, lots of "4"s to squash', 160, 142);
  
  if (best !== null) {
    g.fillText('best: ' + best + ' fails', 160, 160);
  }
}

function drawEnd() {
  paper();
  g.textAlign = 'center';
  g.fillStyle = INK;
  
  const v = Math.max(4, 10 - Math.floor(deaths / 2));
  
  g.font = 'bold 24px monospace';
  g.fillText('PASSED!', 160, 48);
  
  g.fillStyle = RED;
  g.font = 'bold 12px monospace';
  g.fillText('final grade: ' + v + '/10' + (deaths === 0 && got === total ? ' + honours' : ''), 160, 72);
  
  g.fillStyle = INK;
  g.font = '9px monospace';
  g.fillText('fails: ' + deaths, 160, 94);
  g.fillText('highlighters: ' + got + '/' + total, 160, 108);
  g.fillText('time: ' + fmt(frames), 160, 122);
  
  if (newRec) g.fillText('new record!', 160, 138);
  if (lock <= 0) g.fillText('click or press any key to retry', 160, 164);
}

function draw() {
  g.save();
  if (state === 'dead' && deadT > 30) {
    g.translate(Math.round(Math.random() * 4 - 2), Math.round(Math.random() * 4 - 2));
  }
  
  if (state === 'title') {
    drawTitle();
  } else if (state === 'end') {
    drawEnd();
  } else {
    drawGame();
  }
  g.restore();
}

const map = {
  ArrowLeft: 'l', a: 'l', A: 'l',
  ArrowRight: 'r', d: 'r', D: 'r',
  ArrowUp: 'j', w: 'j', W: 'j', ' ': 'j', z: 'j'
};

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = map[e.key];
  if (k || e.key === 'r' || e.key === 'R') e.preventDefault();
  if (e.repeat) return;
  if (anyKey()) return;
  
  if ((e.key === 'r' || e.key === 'R') && state === 'play') {
    resetLevel();
    return;
  }
  if (k) {
    if (k === 'j' && !K.j && pl) pl.jb = 6;
    K[k] = true;
  }
});

addEventListener('keyup', e => {
  const k = map[e.key];
  if (k) K[k] = false;
});

addEventListener('blur', () => {
  K.l = K.r = K.j = false;
});

cv.addEventListener('pointerdown', () => anyKey());

document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (anyKey()) return;
    if (k === 'j' && !K.j && pl) pl.jb = 6;
    K[k] = true;
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
    b.addEventListener(ev, () => { K[k] = false; });
  });
});

load(0);
let last = 0;
let acc = 0;

function loop(t) {
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= 1000 / 60) {
    update();
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(t => {
  last = t;
  loop(t);
});
</script>

</body>
</html>
